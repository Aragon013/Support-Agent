appId: com.remotesupportpro.controller
productName: RemoteSupportPro Controller
copyright: Copyright © RemoteSupportPro

# Directory that already contains the compiled output produced by `npm run build`.
directories:
  output: ../../artifacts/releases/controller/windows/installer
  buildResources: build

# Files packaged inside the app (app.asar). The backend is intentionally
# excluded here and shipped via extraResources instead (see below), because
# electron-builder prunes nested node_modules inside the asar.
files:
  - dist-electron/**/*
  - "!dist-electron/backend/**/*"
  - dist-renderer/**/*
  - package.json

# The control-plane backend + its production node_modules are copied verbatim
# (node_modules preserved) into resources/backend so Node can spawn it as a
# child process at runtime.
extraResources:
  - from: dist-electron/backend
    to: backend

win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: RemoteSupportPro-Controller-Setup-${version}.${ext}
  # icon: build/icon.ico   # optional: drop a 256x256 icon.ico in build/ to brand it

# Assisted installer (wizard) with installation-type selection:
#  - user chooses per-user vs per-machine (installation type)
#  - user can change the installation directory
nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: RemoteSupportPro Controller
  runAfterFinish: true
  deleteAppDataOnUninstall: false
  installerLanguages:
    - en_US
    - es_ES
